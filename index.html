<!DOCTYPE html>
<html lang="en-PH">
    <head>
        <meta name="viewport" content="width=device=width, initial-scale=1.0">
        <meta charset="utf-8">
        <title>John Carl's Profile</title>
        <link href="styles.css" rel="stylesheet">
        <!--google icons font-->
        <!--/*Material Inspired WebProfile with CSS Grid System
        //Author: John Carl Acosta (carleaux)
        //github: johncarl2234 */-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="element1">
                <span id="badgeIcon" class="material-symbols-outlined" style="font-size: 53px;">
                    badge
                    </span>
                <h1 class="headerT">Designer
                <br/>Profile</h1>
            </div>
            <main class="element2 animated-gradient">
                <div class="content">
                    <div class="image-container animateOnScroll" id="myProfile">
                        <img id="profilePicture" src="" alt="Facebook Profile Picture">
                      </div>
                      <p class="IName animateOnScroll">John Carl Acosta</p>
                      <div class="basicinfo">
                        <p id="infoN" class="animateOnScroll">17 Years | Senior High | Tacloban City, Leyte</p>
                        <p id="Motto">Motto: Strive for the better further than beyond!</p>
                    </div>
                </div>
            </main>                
            <div class="element3">
                <img id="explore" src="SVG\Asset 1.svg"/>
                <h1 class="headerB">Get to know more 
                    <br/> about him?</h1>
                <div id="btpParagraph">
                    <p>Visit his other profile.</p>
                </div>
                <a href="https://web.facebook.com/profile.php?id=100094255302259" target="_blank">
                <div class="button-container">
                    <img id="facebookIcon"src="https://upload.wikimedia.org/wikipedia/en/thumb/0/04/Facebook_f_logo_%282021%29.svg/1024px-Facebook_f_logo_%282021%29.svg.png" alt="facebook-icon">
                    <label for="facebookIcon">Send a Friend Request</label>
                </div>
                </a>
                <a href="https://github.com/JohnCarl2234" target="_blank">
                <div class="button-container">
                    <img id="githubIcon"src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="github-logo">
                    <label for="githubIcon">Visit his Github Profile</label>
                </div>
                </a>
            </div>
        </div>
        <script src="script.js"></script>
        <script src="https://apis.google.com/js/api.js"></script>
    </body>
</html>
